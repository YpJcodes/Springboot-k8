apiVersion: apps/v1

kind: Deployment

metadata:
  name: springboot-service

  namespace: jenkins


spec:

  replicas: 3

  selector:
    matchLabels:
      app: springboot-ki

  template:

    metadata:
      labels:
        app: springboot-ki

    spec:

      containers:

        - name: springboot-ki

          image: phanijayanth/springboot-k8s-demo

          imagePullPolicy: Always

          ports:

            - containerPort: 8089
